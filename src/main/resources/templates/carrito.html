<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <link rel="stylesheet" th:href="@{/css/carrito.css}">
</head>
<body>

<header>
    <nav>
        <a th:href="@{/view-productos}">Productos</a>
        <a th:href="@{/carrito}">Carrito</a>
        <a th:href="@{/logout}">Salir</a>
    </nav>
</header>

<main>
    <h1>🛒 Mi Carrito</h1>

    <!-- Mensaje de éxito o error -->
    <div th:if="${mensaje}" class="mensaje">
        <p th:text="${mensaje}"></p>
    </div>

    <!-- Carrito vacío -->
    <div th:if="${items.isEmpty()}" class="carrito-vacio">
        <p>Tu carrito está vacío</p>
    </div>

    <!-- Lista de items del carrito -->
    <div th:each="item : ${items}" class="item">
        <h3 th:text="${item.producto.nombre}"></h3>
        <p>Precio: $<span th:text="${item.producto.precio}"></span></p>
        <p>Cantidad: <span th:text="${item.cantidad}"></span></p>

        <!-- Botón para aumentar cantidad -->
        <form th:action="@{/carrito/agregar/{id}(id=${item.producto.id})}" method="post" style="display:inline;">
            <button>+</button>
        </form>

        <!-- Botón para disminuir cantidad -->
        <form th:action="@{/carrito/disminuir/{id}(id=${item.id})}" method="post" style="display:inline;">
            <button>-</button>
        </form>

        <!-- Botón para eliminar item -->
        <form th:action="@{/carrito/eliminar/{id}(id=${item.id})}" method="post" style="display:inline;">
            <button>Eliminar</button>
        </form>
    </div>

    <!-- Total y botón comprar -->
    <div th:if="${!items.isEmpty()}">
        <h2>Total: $<span th:text="${total}"></span></h2>

        <!-- Botón comprar -->
        <form th:action="@{/carrito/comprar}" method="post">
            <button type="submit">Comprar</button>
        </form>
    </div>
</main>

</body>
</html>
