<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>
<body>

<h1>Lista de Productos</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Descripción</th>
        <th>Stock</th>
    </tr>
    <tr th:each="p : ${productos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.descripcion}"></td>
        <td th:text="${p.stock}"></td>
    </tr>
</table>

<h2>Agregar Producto</h2>
<form th:action="@{/view-productos/agregar}" th:object="${productoNuevo}" method="post">
    <label>Nombre: <input type="text" th:field="*{nombre}" required /></label><br>
    <label>Precio: <input type="number" step="0.01" th:field="*{precio}" required /></label><br>
    <label>Descripción: <input type="text" th:field="*{descripcion}" /></label><br>
    <label>Stock: <input type="number" th:field="*{stock}" required /></label><br>
    <button type="submit">Agregar</button>
</form>

</body>
</html>
