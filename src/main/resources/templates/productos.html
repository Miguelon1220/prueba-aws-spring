<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos | TechStore</title>
    <link rel="stylesheet" th:href="@{/css/productos.css}">
</head>

<body>

<header>
    <h1>TechStore</h1>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/view-productos}">Productos</a>
        <a th:href="@{/contacto}">Contacto</a>

        <!-- CARRITO SOLO SI ESTÁ LOGUEADO -->
        <a th:if="${usuarioLogueado != null}" th:href="@{/carrito}">
            🛒 Carrito
        </a>

        <!-- SI NO ESTÁ LOGUEADO -->
        <a th:if="${usuarioLogueado == null}" th:href="@{/login}">
            Login
        </a>

        <!-- SI ESTÁ LOGUEADO -->
        <a th:if="${usuarioLogueado != null}" th:href="@{/perfil}">
            Perfil
        </a>
        <a th:if="${usuarioLogueado != null}" th:href="@{/logout}">
            Logout
        </a>

        <!-- ICONO ADMIN -->
        <span th:if="${usuarioLogueado != null and usuarioLogueado.rol == 'ADMIN'}">
            👷 Admin
        </span>
    </nav>
</header>

<main>

    <h2>Catálogo de Productos</h2>

    <div class="productos">
        <div class="producto" th:each="p : ${productos}">

            <img th:src="${p.imagenUrl != null
                ? p.imagenUrl
                : 'https://img.icons8.com/color/200/box.png'}">

            <h3 th:text="${p.nombre}"></h3>
            <p th:text="${p.descripcion}"></p>

            <div class="precio">
                $<span th:text="${p.precio}"></span>
            </div>

            <div class="stock">
                Stock: <span th:text="${p.stock}"></span>
            </div>

            <!-- AGREGAR AL CARRITO SOLO SI ESTÁ LOGUEADO -->
            <form th:if="${usuarioLogueado != null}"
                  th:action="@{/carrito/agregar/{id}(id=${p.id})}"
                  method="post">
                <button>Agregar al carrito</button>
            </form>

            <!-- BOTÓN ELIMINAR SOLO ADMIN -->
            <form th:if="${usuarioLogueado != null and usuarioLogueado.rol == 'ADMIN'}"
                  th:action="@{/view-productos/eliminar/{id}(id=${p.id})}"
                  method="post">
                <button type="submit"
                        onclick="return confirm('¿Eliminar este producto?')">
                    Eliminar
                </button>
            </form>

        </div>
    </div>

    <!-- FORMULARIO SOLO ADMIN -->
    <div th:if="${usuarioLogueado != null and usuarioLogueado.rol == 'ADMIN'}">

        <h2>Agregar Nuevo Producto</h2>

        <form th:action="@{/view-productos/agregar}"
              method="post"
              th:object="${productoNuevo}"
              enctype="multipart/form-data">

            <input type="text" th:field="*{nombre}" placeholder="Nombre" required>
            <input type="text" th:field="*{descripcion}" placeholder="Descripción" required>
            <input type="number" th:field="*{precio}" step="0.01" placeholder="Precio" required>
            <input type="number" th:field="*{stock}" placeholder="Stock" required>

            <input type="text" th:field="*{imagenUrl}" placeholder="URL de imagen (opcional)">
            <input type="file" name="imagenArchivo">

            <button type="submit">Agregar Producto</button>
        </form>

    </div>

</main>

<footer>
    <p>&copy; 2026 TechStore</p>
</footer>

</body>
</html>
