<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" th:href="@{/css/productos.css}">
</head>

<body>

<header>
    <h1>TechStore</h1>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/view-productos}">Productos</a>
        <a th:href="@{/contacto}">Contacto</a>

        <!-- SOLO ADMIN -->
        <a th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol == 'ADMIN'}"
           th:href="@{/admin}">
            👷
        </a>

        <!-- NO logueado -->
        <span th:if="${session.usuarioLogueado == null}">
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/register}">Register</a>
    </span>

        <!-- Logueado -->
        <span th:if="${session.usuarioLogueado != null}">
        <a th:href="@{/perfil}">Perfil</a>
        <a th:href="@{/logout}">Logout</a>
    </span>
    </nav>
</header>

<main>
    <h2>Catálogo de Productos</h2>

    <div class="productos">
        <div class="producto" th:each="p : ${productos}">
            <img th:src="${p.imagenUrl != null ? p.imagenUrl : 'https://img.icons8.com/color/200/box.png'}" alt="Imagen Producto">

            <h3 th:text="${p.nombre}"></h3>
            <p th:text="${p.descripcion}"></p>

            <div class="precio">
                $<span th:text="${p.precio}"></span>
            </div>

            <div class="stock">
                Stock: <span th:text="${p.stock}"></span>
            </div>

            <!-- Botón Eliminar -->
            <form th:action="@{/view-productos/eliminar/{id}(id=${p.id})}" method="post" style="margin-top:5px;">
                <button type="submit" onclick="return confirm('¿Seguro que quieres eliminar este producto?')">Eliminar</button>
            </form>
        </div>
    </div>

    <h2>Agregar Nuevo Producto</h2>
    <form th:action="@{/view-productos/agregar}" method="post" th:object="${productoNuevo}" enctype="multipart/form-data">
        <input type="text" th:field="*{nombre}" placeholder="Nombre" required>
        <input type="text" th:field="*{descripcion}" placeholder="Descripción" required>
        <input type="number" th:field="*{precio}" placeholder="Precio" step="0.01" required>
        <input type="number" th:field="*{stock}" placeholder="Stock" required>

        <label>Imagen desde URL:</label>
        <input type="text" th:field="*{imagenUrl}" placeholder="https://...">

        <label>O subir imagen desde tu PC:</label>
        <input type="file" name="imagenArchivo">

        <button type="submit">Agregar Producto</button>
    </form>
</main>

<footer>
    <p>&copy; 2026 TechStore</p>
</footer>

</body>
</html>
